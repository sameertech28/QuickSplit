{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} Expense | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">{{ action }} Expense</h2>
                    <p class="text-muted">for {{ group.name }}</p>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2">{{ action }} Expense</button>
                        {% if action == 'Edit' %}
                        <a href="{% url 'expenses:detail' expense.pk %}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
                        {% else %}
                        <a href="{% url 'groups:detail' group.pk %}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
