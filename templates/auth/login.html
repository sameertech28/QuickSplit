{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign In | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted">Sign in to continue to QuickSplit</p>
                </div>
                
                <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">Sign In</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">
                        Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Sign up here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
