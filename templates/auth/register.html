{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Account | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Create an Account</h2>
                    <p class="text-muted">Join QuickSplit to effortlessly manage shared expenses</p>
                </div>
                
                <form method="post" action="{% url 'signup' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">Create Account</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">
                        Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
