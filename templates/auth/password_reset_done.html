{% extends 'base.html' %}

{% block title %}Email Sent | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card text-center">
                <div class="text-success mb-3"><i class="fa-solid fa-envelope-circle-check fa-3x"></i></div>
                <h2 class="fw-bold">Check your email</h2>
                <p class="text-muted mt-3">
                    If an account exists with the email you entered, we have sent password reset instructions to it. Please check your inbox and spam folder.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Back to Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
