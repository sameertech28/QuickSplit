{% extends 'base.html' %}

{% block title %}Password Reset Complete | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card text-center">
                <div class="text-success mb-3"><i class="fa-solid fa-circle-check fa-3x"></i></div>
                <h2 class="fw-bold">Password Reset Complete</h2>
                <p class="text-muted mt-3">
                    Your password has been set successfully. You can now sign in with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-3">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
