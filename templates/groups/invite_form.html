{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Invite to {{ group.name }} | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Invite Member</h2>
                    <p class="text-muted">Invite someone to join <strong>{{ group.name }}</strong></p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2">Send Invitation</button>
                        <a href="{% url 'groups:detail' group.pk %}" class="btn btn-link text-muted text-decoration-none">Back to Group</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
