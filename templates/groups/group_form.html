{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} Group | QuickSplit{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">{{ action }} Group</h2>
                    <p class="text-muted">Create a new space to share expenses.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2">{{ action }} Group</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
